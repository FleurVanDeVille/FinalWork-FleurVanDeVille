services:
  mongo:
    image: mongo:7
    container_name: savebuddy-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: savebuddy
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savebuddy-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5500:5500"
    depends_on:
      - mongo

volumes:
  mongo-data: